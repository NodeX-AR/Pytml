<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pytml Help Bot</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --surface-elevated: #252525;
            --surface-input: #2a2a2a;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --text-muted: #5f6368;
            --border: #303030;
            --border-focus: #4a4a4a;
            --accent: #8ab4f8;
            --accent-hover: #6a9ef0;
            --accent-glow: rgba(138, 180, 248, 0.15);
            --user-bubble: #2a2a2a;
            --bot-avatar: linear-gradient(135deg, #8ab4f8, #34a853);
            --radius: 28px;
            --radius-sm: 16px;
            --radius-xs: 12px;
            --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
            --shadow-input: 0 2px 12px rgba(0, 0, 0, 0.5);
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text-primary);
            font-family: "Google Sans", "Segoe UI", Roboto, system-ui, -apple-system, Arial, sans-serif;
            overflow: hidden;
        }

        /* ─── APP SHELL ─── */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100dvh;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }

        /* ─── HEADER ─── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            flex-shrink: 0;
            background: var(--bg);
            z-index: 10;
            border-bottom: 1px solid transparent;
        }
        .header .logo {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: -0.3px;
            background: linear-gradient(90deg, #8ab4f8, #aecbfa, #8ab4f8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .logo::before {
            content: "";
            font-size: 22px;
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            color: #8ab4f8;
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }
        .header-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition);
        }
        .header-btn:hover {
            background: var(--surface);
        }

        /* ─── MAIN CONTENT ─── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px 20px 20px;
            min-height: 0;
            transition: justify-content 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
        }
        .main.has-messages {
            justify-content: flex-start;
        }

        /* ─── GREETING ─── */
        .greeting {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 640px;
            padding: 0 8px;
            transition: opacity 0.4s ease, transform 0.4s ease;
            flex-shrink: 0;
        }
        .greeting.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(12px);
            position: absolute;
        }
        .greeting h1 {
            font-size: clamp(36px, 7vw, 52px);
            font-weight: 500;
            margin: 0 0 4px 0;
            background: linear-gradient(90deg, #8ab4f8, #aecbfa, #8ab4f8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .greeting p {
            font-size: clamp(20px, 3.5vw, 30px);
            color: var(--text-secondary);
            font-weight: 400;
            margin: 0 0 0 0;
            letter-spacing: -0.2px;
        }

        /* ─── MESSAGES ─── */
        .messages-wrapper {
            flex: 1;
            width: 100%;
            max-width: 760px;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            padding: 12px 0 8px 0;
            scroll-behavior: smooth;
            min-height: 0;
        }
        .messages-wrapper.visible {
            display: flex;
        }

        .messages-wrapper::-webkit-scrollbar {
            width: 4px;
        }
        .messages-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-wrapper::-webkit-scrollbar-thumb {
            background: var(--border-focus);
            border-radius: 8px;
        }

        .messages {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 4px 8px 4px 4px;
            width: 100%;
        }

        /* ─── MESSAGE ROWS ─── */
        .msg-row {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            padding: 10px 4px;
            animation: msgIn 0.3s ease forwards;
            opacity: 0;
            transform: translateY(8px);
        }
        @keyframes msgIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .msg-row.user {
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--bot-avatar);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: #fff;
            font-weight: 500;
        }
        .msg-row.user .msg-avatar {
            background: linear-gradient(135deg, #8ab4f8, #6a9ef0);
            font-size: 14px;
        }

        .bubble {
            font-size: 15px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            max-width: 85%;
            padding: 6px 0;
            color: var(--text-primary);
        }
        .msg-row.user .bubble {
            background: var(--user-bubble);
            padding: 10px 18px;
            border-radius: 20px 20px 4px 20px;
            max-width: 75%;
            border: 1px solid var(--border);
        }
        .msg-row.bot .bubble {
            padding: 6px 0;
            color: var(--text-primary);
        }

        /* ---- Markdown styling for bot messages (ADDED) ---- */
        .msg-row.bot .bubble h1,
        .msg-row.bot .bubble h2,
        .msg-row.bot .bubble h3 {
            margin: 0.5em 0 0.25em;
            font-weight: 600;
        }
        .msg-row.bot .bubble h1 { font-size: 1.5em; }
        .msg-row.bot .bubble h2 { font-size: 1.3em; }
        .msg-row.bot .bubble h3 { font-size: 1.1em; }

        .msg-row.bot .bubble ul,
        .msg-row.bot .bubble ol {
            padding-left: 1.5em;
            margin: 0.3em 0;
        }
        .msg-row.bot .bubble li {
            margin-bottom: 0.2em;
        }

        .msg-row.bot .bubble blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 1em;
            margin: 0.5em 0;
            color: var(--text-secondary);
        }

        .msg-row.bot .bubble a {
            color: var(--accent);
            text-decoration: underline;
        }
        .msg-row.bot .bubble a:hover {
            color: var(--accent-hover);
        }

        .msg-row.bot .bubble pre {
            background: var(--surface-elevated);
            border-radius: var(--radius-xs);
            padding: 0;
            margin: 0.5em 0;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.6;
            border: 1px solid var(--border);
        }
        .msg-row.bot .bubble pre code {
            display: block;
            padding: 12px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            background: transparent;
            color: #d4d4d4;
            white-space: pre;
            word-break: normal;
        }
        .msg-row.bot .bubble code:not(pre code) {
            background: var(--surface-elevated);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 13px;
            color: #d4d4d4;
            font-family: 'JetBrains Mono', monospace;
        }

        /* ─── TYPING DOTS ─── */
        .typing-dots {
            display: inline-flex;
            gap: 5px;
            padding: 8px 0;
        }
        .typing-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: dotBounce 1.3s infinite ease-in-out;
        }
        .typing-dots span:nth-child(2) {
            animation-delay: 0.15s;
        }
        .typing-dots span:nth-child(3) {
            animation-delay: 0.3s;
        }
        @keyframes dotBounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.35;
            }
            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        /* ─── INPUT AREA ─── */
        .input-area {
            width: 100%;
            max-width: 760px;
            flex-shrink: 0;
            padding: 12px 0 4px 0;
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .main:not(.has-messages) .input-area {
            padding-top: 20px;
        }
        .main.has-messages .input-area {
            padding-top: 8px;
        }

        .composer {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 4px 4px 4px 20px;
            transition: all var(--transition);
            box-shadow: var(--shadow-input);
        }
        .composer:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow-input);
            background: var(--surface-elevated);
        }

        .composer input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 15px;
            color: var(--text-primary);
            padding: 12px 0;
            font-family: inherit;
            min-width: 0;
        }
        .composer input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .composer .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 18px;
            transition: all var(--transition);
        }
        .composer .icon-btn:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .composer .send-btn {
            background: var(--accent);
            color: #0d0d0d;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 18px;
            transition: all var(--transition);
        }
        .composer .send-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.04);
        }
        .composer .send-btn:disabled {
            background: var(--border-focus);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        /* ─── DISCLAIMER ─── */
        .disclaimer {
            font-size: 11.5px;
            color: var(--text-muted);
            text-align: center;
            padding: 10px 0 2px 0;
            letter-spacing: 0.2px;
            user-select: none;
        }
        .disclaimer .grad {
            background: linear-gradient(90deg, #8ab4f8, #aecbfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 500;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 600px) {
            .header {
                padding: 10px 16px;
            }
            .header .logo {
                font-size: 18px;
            }
            .main {
                padding: 0 12px 16px 12px;
            }
            .greeting h1 {
                font-size: 30px;
            }
            .greeting p {
                font-size: 20px;
                margin-bottom: 0;
            }
            .composer {
                padding: 2px 2px 2px 14px;
                border-radius: 24px;
            }
            .composer input {
                font-size: 14px;
                padding: 10px 0;
            }
            .composer .send-btn,
            .composer .icon-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
            .msg-row {
                padding: 6px 0;
            }
            .bubble {
                font-size: 14px;
            }
            .msg-row.user .bubble {
                max-width: 85%;
                padding: 8px 14px;
            }
        }

        @media (max-width: 420px) {
            .greeting h1 {
                font-size: 26px;
            }
            .greeting p {
                font-size: 17px;
            }
        }

        /* ─── SCROLLBAR GLOBAL ─── */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-focus);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ─── HEADER ─── -->
        <header class="header">
            <span class="logo">Pytml</span>
            <div class="header-actions">
                <button class="header-btn" id="clearBtn" title="Clear chat">✕</button>
            </div>
        </header>

        <!-- ─── MAIN ─── -->
        <main class="main" id="main">

            <!-- Greeting -->
            <div class="greeting" id="greeting">
                <h1>Hello</h1>
                <p>How can I help you today?</p>
            </div>

            <!-- Messages -->
            <div class="messages-wrapper" id="messagesWrapper">
                <div class="messages" id="messages"></div>
            </div>

            <!-- Input -->
            <div class="input-area" id="inputArea">
                <form class="composer" id="form">
                    <input
                    id="input"
                    type="text"
                    placeholder="Ask Pytml"
                    autocomplete="off"
                    autofocus
                    />
                    <button type="button" class="icon-btn" id="attachBtn" title="Attach">📎</button>
                    <button type="submit" class="send-btn" id="sendBtn" title="Send">➤</button>
                </form>
                <div class="disclaimer">
                    <span class="made-with">Made with <span class="grad">Gemini</span></span>
                    · Please recheck responses
                </div>
            </div>

        </main>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ───
            const main = document.getElementById('main');
            const greeting = document.getElementById('greeting');
            const messagesWrapper = document.getElementById('messagesWrapper');
            const messages = document.getElementById('messages');
            const form = document.getElementById('form');
            const input = document.getElementById('input');
            const sendBtn = document.getElementById('sendBtn');
            const clearBtn = document.getElementById('clearBtn');

            let isProcessing = false;

            // ─── Helpers ───
            function scrollToBottom() {
                requestAnimationFrame(() => {
                    messagesWrapper.scrollTop = messagesWrapper.scrollHeight;
                });
            }

            function setHasMessages(has) {
                main.classList.toggle('has-messages', has);
                greeting.classList.toggle('hidden', has);
                messagesWrapper.classList.toggle('visible', has);
            }

            // ─── Add message ───
            function addMessage(text, role) {
                const row = document.createElement('div');
                row.className = `msg-row ${role}`;

                const avatar = document.createElement('div');
                avatar.className = 'msg-avatar';
                avatar.textContent = role === 'user' ? 'U' : '';

                const bubble = document.createElement('div');
                bubble.className = 'bubble';

                if (role === 'bot') {
                    bubble.innerHTML = formatBotText(text);
                    // highlight code blocks inside this bubble
                    const codes = bubble.querySelectorAll('pre code');
                    codes.forEach((block) => {
                        hljs.highlightElement(block);
                    });
                } else {
                    bubble.textContent = text;
                }

                row.appendChild(avatar);
                row.appendChild(bubble);
                messages.appendChild(row);

                setHasMessages(true);
                scrollToBottom();
            }

            function formatBotText(text) {
                const html = marked.parse(text);
                return html;
            }

            // ─── Typing indicator ───
            function showTyping() {
                const row = document.createElement('div');
                row.className = 'msg-row bot';
                row.id = 'typingRow';

                const avatar = document.createElement('div');
                avatar.className = 'msg-avatar';
                avatar.textContent = '';

                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;

                row.appendChild(avatar);
                row.appendChild(bubble);
                messages.appendChild(row);

                setHasMessages(true);
                scrollToBottom();
                return row;
            }

            function hideTyping() {
                const row = document.getElementById('typingRow');
                if (row) row.remove();
            }

            // ─── Send message to backend ───
            async function sendToBackend(message) {
                const response = await fetch('https://pytml.vercel.app/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message }),
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server error (${response.status}): ${errorText}`);
                }

                const data = await response.json();
                if (data.reply === undefined) {
                    throw new Error('Unexpected response format: missing "reply" field');
                }
                return data.reply;
            }

            // ─── Handle send ───
            async function handleSend() {
                const text = input.value.trim();
                if (!text || isProcessing) return;

                isProcessing = true;
                sendBtn.disabled = true;

                addMessage(text, 'user');
                input.value = '';
                input.focus();

                const typingRow = showTyping();

                try {
                    const reply = await sendToBackend(text);
                    hideTyping();
                    addMessage(reply, 'bot');
                } catch (err) {
                    hideTyping();
                    console.error('Chat error:', err);
                    addMessage(`Error: ${err.message || 'Something went wrong'}`, 'bot');
                } finally {
                    isProcessing = false;
                    sendBtn.disabled = false;
                    scrollToBottom();
                }
            }

            // ─── Clear chat ───
            function clearChat() {
                messages.innerHTML = '';
                setHasMessages(false);
                input.value = '';
                input.focus();
                const typingRow = document.getElementById('typingRow');
                if (typingRow) typingRow.remove();
                isProcessing = false;
                sendBtn.disabled = false;
            }

            // ─── Event listeners ───
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                handleSend();
            });

            clearBtn.addEventListener('click', clearChat);

            document.addEventListener('keydown', (e) => {
                if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                    e.preventDefault();
                    input.focus();
                }
                if (e.key === 'Escape') {
                    input.blur();
                }
            });

            document.getElementById('attachBtn').addEventListener('click', () => {
                input.value = 'Can you help me with a file?';
                input.focus();
            });

            // ─── Init ───
            setHasMessages(false);
            input.focus();
        })();
    </script>

</body>
</html>
