<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pytml Greeting</title>
  <script src="../pytml.js"></script>
  <style>
    body { font-family: system-ui; padding: 30px; max-width: 560px; margin: auto; }
    input { padding: 12px; width: 220px; }
    button { padding: 12px 18px; margin-left: 6px; cursor: pointer; }
    #result { margin-top: 20px; font-size: 24px; }
  </style>
</head>
<body>
<h1>Greeting</h1>

<py1>

<input1>Type your name</input1>
<btn1>Say hello</btn1>


def greet(e):
    result.text = "Hello, " + input1.value + "!"


btn1.on("click", greet)

</py1>

<p id="result"></p>
<p><a href="../demo.html">← Back to demos</a></p>
</body>
</html>
