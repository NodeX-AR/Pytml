<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pytml - Counter</title>
    <script src="https://pytml.vercel.app/pytml.js"></script>
</head>
<body>
    <h1>Count: <span id="number">0</span></h1>

    <!-- py-click="name" runs the Python function called name -->
    <button py-click="add">+1</button>
    <button py-click="remove">-1</button>
    <button py-click="count = 0; show()">Reset</button>

    <py>
count = 0

def show():
    number.text = count

def add():
    global count
    count += 1
    show()

def remove():
    global count
    count -= 1
    show()
    </py>
</body>
</html>
