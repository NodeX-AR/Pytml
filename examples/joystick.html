<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pytml Joystick</title>
  <script src="https://pytml.vercel.app/pytml.js"></script>
  <style>
    body { font-family: system-ui; padding: 30px; max-width: 560px; margin: auto; text-align: center; }
    #stick { width: 180px; height: 180px; border-radius: 50%; border: 3px solid #444; margin: 30px auto; color: #222; background: #eee; }
    pre { text-align: left; display: inline-block; padding: 14px; background: #f4f4f5; border-radius: 8px; }
  </style>
</head>
<body>
<h1>Touch Joystick</h1>
<div id="stick"></div>
<pre id="state">x=0.00 y=0.00 magnitude=0.00</pre>

<py1>
from pytml import joystick

stick = joystick("stick")


def move(event):
    state.text = f"x={event['joystick_x']:.2f} y={event['joystick_y']:.2f} magnitude={event['magnitude']:.2f}"


stick.on("joystickmove", move)
</py1>

<p><a href="../demo.html">← Back to demos</a></p>
</body>
</html>
