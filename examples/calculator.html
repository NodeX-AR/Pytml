<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pytml - Calculator</title>
    <script src="https://pytml.vercel.app/pytml.js"></script>
</head>
<body>
    <h1>Calculator</h1>
    <!-- input() asks with a text box, pick() shows one button per option -->
    <py>
a = int(input("First number: "))
op = pick("+", "-", "*", "/", prompt="Operation:")
b = int(input("Second number: "))

if op == "+":
    answer = a + b
elif op == "-":
    answer = a - b
elif op == "*":
    answer = a * b
else:
    answer = a / b

print(f"{a} {op} {b} = {answer}")
    </py>
</body>
</html>
